version: 2

updates:
  # ─── npm / Node.js (zaru-mcp-server) ──────────────────────────────────────
  - package-ecosystem: npm
    directory: /zaru-mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Node is 24. Its types follow it.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 breaks the ts-node/esm test loader (it no longer ships
      # the compiler API ts-node uses). Comes off when the loader is replaced.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ─── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
