name: CI

on:
  push:
    branches: [main]
    paths:
      - "zaru-mcp-server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "zaru-mcp-server/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: zaru-mcp-server

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: zaru-mcp-server/.nvmrc
          cache: "npm"
          cache-dependency-path: zaru-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The Cloudflare Workers entrypoint (src/worker.ts, AEGIS ADR-123 step S5):
  # its typecheck against the runtime types wrangler generates, its tests in
  # the Workers runtime (wrangler's local workerd), and a dry-run deploy of
  # both environments, which needs no Cloudflare token.
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: zaru-mcp-server/.nvmrc
          cache: "npm"
          cache-dependency-path: zaru-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Workers)
        run: npm run worker:typecheck

      - name: Test in the Workers runtime
        run: npm run worker:test

      - name: wrangler deploy --dry-run (staging and production)
        run: npm run worker:dry-run

  image:
    name: Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t zaru-mcp-server:ci .

      - name: The image runs the Node in .nvmrc and serves /health
        run: |
          major="$(cat .nvmrc)"
          node="$(docker run --rm zaru-mcp-server:ci node -p process.versions.node)"
          echo "The image runs Node ${node}; .nvmrc says ${major}."
          test "${node%%.*}" = "${major}"
          docker run -d --name smoke -p 127.0.0.1:3000:3000 zaru-mcp-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          body="$(curl -fsS http://127.0.0.1:3000/health)"
          echo "GET /health: ${body}"
          test "${body}" = '{"status":"ok"}'
          docker logs smoke | grep -F "\"node_version\":\"v${node}\""
          docker rm -f smoke

      - name: Image size
        run: docker image inspect zaru-mcp-server:ci --format 'zaru-mcp-server:ci {{.Size}} bytes'

      - name: Image size of the base branch, for comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth 1 origin "${BASE_SHA}"
          git worktree add "${RUNNER_TEMP}/base" FETCH_HEAD
          docker build -t zaru-mcp-server:base "${RUNNER_TEMP}/base/zaru-mcp-server"
          echo "base image Node $(docker run --rm zaru-mcp-server:base node -p process.versions.node)"
          docker image inspect zaru-mcp-server:base --format 'zaru-mcp-server:base {{.Size}} bytes'
